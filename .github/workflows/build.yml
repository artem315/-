name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project and find build.gradle
        run: |
          set -e
          mkdir -p unpacked
          ZIP=$(ls ./*.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            echo "Unzipping $ZIP"
            unzip -q -o "$ZIP" -d unpacked
          fi
          GRADLE_FILE=$(find unpacked -name build.gradle 2>/dev/null | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2- || true)
          if [ -z "$GRADLE_FILE" ] && [ -f build.gradle ]; then
            GRADLE_FILE=build.gradle
          fi
          if [ -z "$GRADLE_FILE" ]; then
            echo "build.gradle not found. Repository tree:"
            find . -path ./.git -prune -o -type f -print | head -n 60
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Project dir: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          gradle build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: jjk-mod
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
          if-no-files-found: error
