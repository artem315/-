name: Build JJK Fabric Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Unzip project
        run: |
          mkdir project
          unzip -q archive.zip-d project
          echo "=== ZIP CONTENTS ==="
          find project -maxdepth 3 -type f

      - name: Find project root
        id: project
        shell: bash
        run: |
          GRADLEW=$(find project -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside ZIP"
            exit 1
          fi

          ROOT=$(dirname "$GRADLEW")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Make Gradle executable
        working-directory: ${{ steps.project.outputs.root }}
        run: chmod +x gradlew

      - name: Build mod
        working-directory: ${{ steps.project.outputs.root }}
        run: ./gradlew clean build --stacktrace

      - name: Collect JAR
        shell: bash
        run: |
          mkdir -p dist

          find "${{ steps.project.outputs.root }}/build/libs" \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            -exec cp {} dist/ \;

          echo "=== BUILT JARS ==="
          ls -lah dist

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: JJK-Fabric-26.2
          path: dist/*.jar
          if-no-files-found: error
